[project]
name = "todo2-backend"
version = "0.1.0"
description = "Python rewrite of todo2 backend"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-jose>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt==3.2.2",
  "httpx>=0.27",
  "cachetools>=5.3",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.5"
]
